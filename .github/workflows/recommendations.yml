name: Recommendations Service CI

on:
  push:
    branches: [main, yahi]
    paths:
      - "recommendations/**"
      - "pyproject.toml"
      - "conftest.py"
      - ".github/workflows/recommendations.yml"
  pull_request:
    branches: [main]
    paths:
      - "recommendations/**"
      - "pyproject.toml"
      - "conftest.py"

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -r recommendations/requirements.txt

      - name: Run Ruff linter
        run: |
          ruff check recommendations/ --output-format=github

      - name: Run Ruff formatter check
        run: |
          ruff format --check recommendations/

      - name: Run Black formatter check
        run: |
          black --check recommendations/

      - name: Run mypy type checker
        run: |
          mypy recommendations/ --config-file=pyproject.toml
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r recommendations/requirements.txt

      - name: Run tests with pytest
        run: |
          cd recommendations
          pytest tests/ -v --tb=short --cov=. --cov-report=term --cov-report=xml --cov-report=html
        env:
          PYTHONPATH: /home/runner/work/ci-agro-helper/ci-agro-helper

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./recommendations/coverage.xml
          flags: recommendations
          name: recommendations-coverage
        if: matrix.python-version == '3.13'
        continue-on-error: true

      - name: Check test coverage threshold
        run: |
          cd recommendations
          coverage report --fail-under=80
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ci-agro-recommendations:latest ./recommendations
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety check
        run: |
          safety check -r recommendations/requirements.txt --json
        continue-on-error: true

      - name: Run Bandit security linter
        run: |
          bandit -r recommendations/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: always()
